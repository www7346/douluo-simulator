plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.douluosimulator.game'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.douluosimulator.game'
        minSdk 28
        targetSdk 35
        versionCode 1036801
        versionName '1.3.68-android.1'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main {
            assets.srcDir '../../build/android/assets'
            res.srcDir '../../build/android/res'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            def signingFile = providers.environmentVariable('DOULUO_ANDROID_KEYSTORE').orNull
            if (signingFile != null) {
                storeFile file(signingFile)
                storeType 'PKCS12'
                storePassword providers.environmentVariable('DOULUO_ANDROID_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('DOULUO_ANDROID_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('DOULUO_ANDROID_KEY_PASSWORD').get()
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
